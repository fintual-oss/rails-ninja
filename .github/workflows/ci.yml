name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Action Pack ${{ matrix.actionpack }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        actionpack:
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"
        exclude:
          - ruby: "3.0"
            actionpack: "7.2"
          - ruby: "3.0"
            actionpack: "8.0"
          - ruby: "3.0"
            actionpack: "8.1"
          - ruby: "3.1"
            actionpack: "8.0"
          - ruby: "3.1"
            actionpack: "8.1"

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/actionpack_${{ matrix.actionpack }}.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: actionpack-${{ matrix.actionpack }}

      - name: Run tests
        run: bundle exec rake test
